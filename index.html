<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresos y Novedades — Parofe</title>

<style>
:root{--bg:#F5F2EE;--ink:#1C1C1C;--mid:#6B6B6B;--line:#D8D4CE;--oferta:#E96E15;--card-bg:#fff}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.header{background:#1C1C1C;padding:25px 20px;display:flex;align-items:center;justify-content:space-between}
.header-date{font-family:'DM Mono',monospace;font-size:12px;color:#aaa;letter-spacing:.06em}
.section-title{background:#012A6F;margin:0;padding:20px 20px}
.section-title h1{font-family:'Barlow',sans-serif;font-size:clamp(36px,8vw,56px);font-weight:700;line-height:.95;text-transform:uppercase;color:#fff}
.tabs-principales{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:2px solid var(--ink);padding:0 20px;margin-top:0;display:flex}
.tab-principal{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:14px 24px;border:none;background:transparent;cursor:pointer;color:var(--mid);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab-principal.active{color:var(--ink);border-bottom-color:var(--ink)}
.tab-principal .n{font-family:'DM Mono',monospace;font-size:12px;margin-left:6px}
.seccion-principal{display:none}
.seccion-principal.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:10px 12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:16px;padding:12px 20px}}
.full-sep{font-family:'DM Mono',monospace;font-weight:500;font-size:24px;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:#012A6F;padding:25px 20px;margin-top:24px}
.card{background:var(--card-bg);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;height:100%;min-height:320px}
.card-img{position:relative;width:100%;aspect-ratio:1/1;background:#f5f5f5;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.card-img img{width:100%;height:100%;object-fit:contain;object-position:center;padding:8px;display:block}
.badge{position:absolute;top:6px;left:6px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4px 8px;border-radius:4px;z-index:1}
.badge-super-oferta{background:#D03071;color:#fff;}
.badge-ingreso{background:#E96E15;color:#fff;}
.badge-oferta{background:#A43A0A;color:#fff;}
.card-body{padding:8px 10px 6px;background:#f0ece6;flex:1}
.card-brand{font-family:'DM Mono',monospace;font-size:10px;color:var(--mid);text-transform:uppercase}
.card-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;line-height:1.15;margin-top:2px}
@media(min-width:600px){.card-name{font-size:16px}}
.card-pres{font-family:'DM Mono',monospace;font-size:9px;color:var(--mid);margin-top:4px;text-transform:uppercase}
.card-foot{background:#0F3F9E;padding:10px 12px 8px;position:relative}
.prices{display:flex;flex-direction:column;gap:1px}
.price-main{font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:800;color:#F5F2EE;line-height:1}
.oferta-card .price-main{font-size:22px}
.price-main-label{font-family:'DM Mono',monospace;font-size:9px;color:#88aadd;letter-spacing:.06em}
.price-secondary{font-family:'DM Mono',monospace;font-size:14px;color:#aac4ee;margin-top:2px}
.dot{position:absolute;top:10px;right:10px;width:6px;height:6px;border-radius:50%;background:#87c035}
@media(max-width:500px){
  .tab-principal{font-size:14px;padding:12px 16px}
}
</style>

function fmt(n){
  if (n === null || n === undefined) return '';
  return '$'+n.toLocaleString('es-AR',{minimumFractionDigits:n%1===0?0:2,maximumFractionDigits:n%1===0?0:2});
}

function cardIngreso(p) {
  const pres = p.bulto_un ? `Bulto x ${p.bulto_un} un ${p.pallet_bultos ? `/ Pallet x ${p.pallet_bultos} bultos` : ''}` : (p.u ? `Bulto x ${p.u} un` : '');
  let pricesHtml = '';
  
  if (p.esPromo) {
    if (p.tipo_oferta === 'promo_20_bultos') {
      pricesHtml = `<div class="prices">
        <div class="price-main">${fmt(p.precio_pallet)}</div>
        <div class="price-main-label">por 20 bultos</div>
        <div class="price-secondary">Bulto ${fmt(p.precio_bulto)}</div>
      </div>`;
    } else if (p.precio_pallet && p.precio_bulto) {
      pricesHtml = `<div class="prices">
        <div class="price-main">${fmt(p.precio_pallet)}</div>
        <div class="price-main-label">por pallet</div>
        <div class="price-secondary">Bulto ${fmt(p.precio_bulto)}</div>
      </div>`;
    }
  } else {
    pricesHtml = `<div class="prices">
      <div class="price-main">${fmt(p.p)}</div>
      <div class="price-main-label">por bulto</div>
    </div>`;
  }
  
  let badgeHtml = '<span class="badge badge-ingreso">INGRESO</span>';
  if (p.destacado) {
    badgeHtml = '<span class="badge badge-super-oferta">SUPER OFERTA</span>';
  }
  
  return `<div class="card">
    <div class="card-img"><img src="${p.i}" alt="${p.n}" loading="lazy">${badgeHtml}</div>
    <div class="card-body">
      <div class="card-brand">${p.m}</div>
      <div class="card-name">${p.n}</div>
      ${pres ? `<div class="card-pres">${pres}</div>` : ''}
      ${p.sabores ? `<div class="card-pres" style="margin-top:4px;color:#E96E15;">${p.sabores}</div>` : ''}
    </div>
    <div class="card-foot">${pricesHtml}<div class="dot"></div></div>
  </div>`;
}

  }
  
  return `<div class="card oferta-card">
    <div class="card-img"><img src="${p.img}" alt="${p.nombre}" loading="lazy"><span class="badge badge-oferta">OFERTA</span></div>
    <div class="card-body">
      <div class="card-brand">${p.marca}</div>
      <div class="card-name">${p.nombre}</div>
      <div class="card-pres">${pres}</div>
    </div>
    <div class="card-foot">${ph}<div class="dot"></div></div>
  </div>`;
}

function cambiarSeccion(seccion, btn) {
  document.querySelectorAll('.seccion-principal').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-principal').forEach(t => t.classList.remove('active'));
  document.getElementById('seccion-' + seccion).classList.add('active');
  btn.classList.add('active');
}

document.getElementById('g-ingresos').innerHTML = I.map(cardIngreso).join('');
document.getElementById('g-ofertas').innerHTML = P.map(cardOferta).join('');
const todosItems = [...I.map(p => ({ ...p, tipo: 'ingreso' })), ...P.map(p => ({ ...p, tipo: 'oferta' }))];
document.getElementById('g-todos').innerHTML = todosItems.map(item => {
  if (item.tipo === 'ingreso') {
    return cardIngreso(item);
  } else {
    return cardOferta(item);
  }
}).join('');
</script>
</body>
