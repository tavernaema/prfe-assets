<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresos y Novedades — Parofe</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Barlow+Condensed:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2EE;--ink:#1C1C1C;--mid:#6B6B6B;--card-bg:#fff;--c-nuevo:#2563eb;--c-destacado:#D03071;--c-pallet:#E96E15;--c-ingreso:#87c035}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#ccc;color:var(--ink);min-height:100vh}
.page{max-width:540px;margin:0 auto;background:var(--bg);min-height:100vh}
@media(min-width:600px){.page{max-width:680px}}
@media(min-width:900px){.page{max-width:860px;box-shadow:0 0 40px rgba(0,0,0,.18)}}
.header{background:#012A6F;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.header-date{font-family:'DM Mono',monospace;font-size:12px;color:#aaa;letter-spacing:.06em}
.section-title{background:#1C1C1C;margin:0;padding:16px 20px}
.section-title h1{font-family:'Barlow',sans-serif;font-size:clamp(32px,8vw,52px);font-weight:700;line-height:.95;text-transform:uppercase;color:#fff}
.tabs-principales{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:2px solid var(--ink);padding:0 12px;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs-principales::-webkit-scrollbar{display:none}
.tab-principal{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:11px 14px;border:none;background:transparent;cursor:pointer;color:var(--mid);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;flex-shrink:0}
.tab-principal.active{color:var(--ink);border-bottom-color:var(--ink)}
.tab-principal .n{font-family:'DM Mono',monospace;font-size:11px;margin-left:4px}
.seccion-principal{display:none}
.seccion-principal.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:10px 12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:16px;padding:12px 20px}}
.card{background:var(--card-bg);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;border:2.5px solid transparent}
.card.tipo-nuevo{border-color:var(--c-nuevo)}
.card.tipo-destacado{border-color:var(--c-destacado);grid-column:span 2}
.card.tipo-pallet{border-color:var(--c-pallet)}
.card.tipo-ingreso{border-color:var(--c-ingreso)}
.card-img{width:100%;background:#f5f5f5;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;min-height:0}
.card-img img{width:100%;height:100%;object-fit:contain;object-position:center;padding:8px;display:block}
.card.tipo-destacado .card-img{aspect-ratio:2/1}
.card:not(.tipo-destacado) .card-img{aspect-ratio:1/1}
.badge{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4px 9px;border-radius:4px;color:#fff;display:inline-block;margin:8px 10px 0;align-self:flex-start}
.badge-nuevo{background:var(--c-nuevo)}
.badge-destacado{background:var(--c-destacado)}
.badge-pallet{background:var(--c-pallet)}
.badge-ingreso{background:#5a8a1f}
.card-body{padding:6px 10px 6px;background:#f0ece6;flex:1}
.card-brand{font-family:'DM Mono',monospace;font-size:10px;color:var(--mid);text-transform:uppercase}
.card-name{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;line-height:1.15;margin-top:2px}
.card-pres{font-family:'DM Mono',monospace;font-size:10px;color:var(--mid);margin-top:4px;text-transform:uppercase}
.card-sabores{font-family:'DM Mono',monospace;font-size:9px;color:#E96E15;margin-top:3px}
.card-foot{padding:10px 12px 8px;position:relative}
.card:not(.tipo-destacado) .card-foot{background:#0F3F9E}
.card.tipo-destacado .card-foot{background:#9b1a4e}
.prices{display:flex;flex-direction:column;gap:1px}
.price-main{font-family:'Barlow Condensed',sans-serif;font-weight:800;color:#F5F2EE;line-height:1}
.card:not(.tipo-destacado) .price-main{font-size:27px}
.card.tipo-destacado .price-main{font-size:36px}
.price-main-label{font-family:'DM Mono',monospace;font-size:9px;color:#88aadd;letter-spacing:.06em}
.card.tipo-destacado .price-main-label{color:#e8a0bb}
.price-secondary{font-family:'DM Mono',monospace;font-size:16px;font-weight:500;color:#F5F2EE;margin-top:3px;opacity:.85}
.card.tipo-destacado .price-secondary{font-size:18px}
.stock-dot{display:inline-flex;align-items:center;gap:4px;position:absolute;bottom:10px;right:10px}
.stock-dot span{width:6px;height:6px;border-radius:50%;background:#87c035;display:block}
.stock-dot label{font-family:'DM Mono',monospace;font-size:8px;color:#87c035;text-transform:uppercase;letter-spacing:.05em}
</style>
</head>

const BADGE = {
  nuevo:     { cls:'badge-nuevo',     label:'NUEVO PRODUCTO' },
  destacado: { cls:'badge-destacado', label:'DESTACADO DE LA SEMANA' },
  pallet:    { cls:'badge-pallet',    label:'OFERTA PALLET' },
  ingreso:   { cls:'badge-ingreso',   label:'INGRESO' },
};

function fmt(n){ return n!=null ? '$'+n.toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0}) : ''; }

function cardProducto(p) {
  const b = BADGE[p.tipo];
  const pres = `Bulto x ${p.bulto_un} un${p.pallet_bultos ? ` / Pallet x ${p.pallet_bultos} bultos` : ''}`;
  let pricesHtml;
  if (p.precio_pallet && p.precio_bulto) {
    pricesHtml = `<div class="prices"><div class="price-main">${fmt(p.precio_pallet)}</div><div class="price-main-label">por pallet</div><div class="price-secondary">Bulto ${fmt(p.precio_bulto)}</div></div>`;
  } else {
    pricesHtml = `<div class="prices"><div class="price-main">${fmt(p.precio_bulto)}</div><div class="price-main-label">por bulto</div></div>`;
  }
  return `<div class="card tipo-${p.tipo}">
    <div class="card-img"><img src="${B+p.img}" alt="${p.nombre}" loading="lazy"></div>
    <span class="badge ${b.cls}">${b.label}</span>
    <div class="card-body">
      <div class="card-brand">${p.marca}</div>
      <div class="card-name">${p.nombre}</div>
      <div class="card-pres">${pres}</div>
      ${p.sabores ? `<div class="card-sabores">${p.sabores}</div>` : ''}
    </div>
    <div class="card-foot">${pricesHtml}<div class="stock-dot"><span></span><label>Stock</label></div></div>
  </div>`;
}

function cambiarSeccion(seccion, btn) {
  document.querySelectorAll('.seccion-principal').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-principal').forEach(t=>t.classList.remove('active'));
  document.getElementById('seccion-'+seccion).classList.add('active');
  btn.classList.add('active');
}

const grupos = { nuevos:[], destacados:[], pallet:[], ingresos:[] };
const map = { nuevo:'nuevos', destacado:'destacados', pallet:'pallet', ingreso:'ingresos' };
productos.forEach(p => grupos[map[p.tipo]].push(p));
Object.entries(grupos).forEach(([k,arr])=>{ document.getElementById('g-'+k).innerHTML = arr.map(cardProducto).join(''); });
document.getElementById('g-todos').innerHTML = productos.map(cardProducto).join('');
