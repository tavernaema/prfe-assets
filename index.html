<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresos y Novedades — Parofe</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2EE;--ink:#1C1C1C;--mid:#6B6B6B;--line:#D8D4CE;--oferta:#E96E15;--card-bg:#fff}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.header{background:#012A6F;padding:10px 20px;display:flex;align-items:center;justify-content:space-between}

.header-date{font-family:'DM Mono',monospace;font-size:12px;color:#aaa;letter-spacing:.06em}
.section-title{padding:20px 20px 0}
.section-title h1{font-family:'Barlow Condensed',sans-serif;font-size:clamp(36px,8vw,56px);font-weight:800;line-height:.95;text-transform:uppercase}
.tabs-wrap{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:2px solid var(--ink);padding:0 20px;margin-top:16px;display:flex}
.tab{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:11px 18px;border:none;background:transparent;cursor:pointer;color:var(--mid);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.active{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{font-family:'DM Mono',monospace;font-size:11px;margin-left:4px}
.grid-section{display:none}
.grid-section.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px 12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.sep{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--mid);padding:16px 20px 6px}
.full-sep{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:#fff;background:var(--ink);padding:12px 20px;margin-top:24px}
/* CARD */
.card{background:var(--card-bg);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.featured{border:2.5px solid #D03071}
.featured-bar{background:#D03071;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px}
.card-img{position:relative;width:100%;aspect-ratio:1/1;background:#fff;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.card-img img{width:100%;height:100%;object-fit:contain;object-position:center;padding:8px;display:block}
.badge{position:absolute;top:6px;left:6px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:4px;border:1.5px solid var(--oferta);color:var(--oferta);background:#fff;z-index:1}
.card-body{padding:8px 10px 6px;background:#f0ece6;flex:1}
.card-brand{font-family:'DM Mono',monospace;font-size:10px;color:var(--mid);text-transform:uppercase}
.card-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;line-height:1.15;margin-top:2px}
.card-pres{font-family:'DM Mono',monospace;font-size:9px;color:var(--mid);margin-top:4px;text-transform:uppercase}
.card-foot{background:#0F3F9E;padding:10px 12px 8px;position:relative}
.prices{display:flex;flex-direction:column;gap:1px}
.price-main{font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:800;color:#F5F2EE;line-height:1}
.price-main-label{font-family:'DM Mono',monospace;font-size:9px;color:#88aadd;letter-spacing:.06em}
.price-secondary{font-family:'DM Mono',monospace;font-size:13px;color:#aac4ee;margin-top:2px}
.dot{position:absolute;top:10px;right:10px;width:6px;height:6px;border-radius:50%;background:#87c035}
</style>
</head>

function fmt(n){
  return '$'+n.toLocaleString('es-AR',{minimumFractionDigits:n%1===0?0:2,maximumFractionDigits:n%1===0?0:2});
}

function cardIngreso(p){
  const pres=p.u?`Bulto x ${p.u} un`:'';
  return `<div class="card">
    <div class="card-img"><img src="${p.i}" alt="${p.n}" loading="lazy"><span class="badge">Ingreso</span></div>
    <div class="card-body">
      <div class="card-brand">${p.m}</div>
      <div class="card-name">${p.n}</div>
      ${pres?`<div class="card-pres">${pres}</div>`:''}
    </div>
    <div class="card-foot">
      <div class="prices">
        <div class="price-main">${fmt(p.p)}</div>
        <div class="price-main-label">por bulto</div>
      </div>
      <div class="dot"></div>
    </div>
  </div>`;
}

function card(p){
  const fb=p.destacada?'<div class="featured-bar">\u2605 DESTACADO</div>':'';
  const pres=`Bulto x ${p.bulto_un} un / Pallet x ${p.pallet_bultos} bultos`;
  const ph=`<div class="prices"><div class="price-main">${fmt(p.precio_pallet)}</div><div class="price-main-label">por pallet</div>${p.precio_bulto?`<div class="price-secondary">Bulto ${fmt(p.precio_bulto)}</div>`:''}</div>`;
  return `<div class="card ${p.destacada?'featured':''}">${fb}<div class="card-img"><img src="${p.img}" alt="${p.nombre}" loading="lazy"><span class="badge">Oferta</span></div><div class="card-body"><div class="card-brand">${p.marca}</div><div class="card-name">${p.nombre}</div><div class="card-pres">${pres}</div></div><div class="card-foot">${ph}<div class="dot"></div></div></div>`;
}

function fill(id,items){document.getElementById(id).innerHTML=items.map(card).join('')}
function showTab(id,btn){
  document.querySelectorAll('.grid-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
}

document.getElementById('g-ingresos').innerHTML=I.map(cardIngreso).join('');
const dest=P.filter(p=>p.destacada);
const rest=P.filter(p=>!p.destacada);
fill('g-dest-1',dest);fill('g-dest-2',dest);
fill('g-rest-1',rest);
