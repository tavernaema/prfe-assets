<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ofertas por Pallet — Parofe</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F2EE;
    --ink: #1C1C1C;
    --mid: #6B6B6B;
    --line: #D8D4CE;
    --oferta: #E96E15;
    --oferta-bg: #FFF3EC;
    --card-bg: #FFFFFF;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
  .header { background: #012A6F; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }
  .header-date { font-family: 'DM Mono', monospace; font-size: 12px; color: #aaa; letter-spacing: 0.06em; }
  .section-title { padding: 20px 20px 0; }
  .section-title h1 { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(36px, 8vw, 56px); font-weight: 800; line-height: 0.95; text-transform: uppercase; }
  .tabs-wrap { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 2px solid var(--ink); padding: 0 20px; margin-top: 16px; display: flex; }
  .tab { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 11px 18px; border: none; background: transparent; cursor: pointer; color: var(--mid); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
  .tab.active { color: var(--ink); border-bottom-color: var(--ink); }
  .tab .n { font-family: 'DM Mono', monospace; font-size: 10px; background: var(--line); color: var(--mid); padding: 2px 5px; border-radius: 2px; margin-left: 5px; }
  .tab.active .n { background: var(--ink); color: var(--bg); }
  .grid-section { display: none; padding: 16px 20px 40px; }
  .grid-section.active { display: block; }
  .sep { font-family: 'DM Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--mid); padding: 16px 0 10px; display: flex; align-items: center; gap: 10px; }
  .sep::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card { background: var(--card-bg); border: 1.5px solid var(--line); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; }
  .card.featured { border: 2.5px solid #D03071; }
  .featured-bar { background: #D03071; color: #fff; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-align: center; padding: 4px 0; }
  .card-img { aspect-ratio: 1; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .card-img img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
  .badge { position: absolute; top: 8px; left: 8px; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; padding: 3px 7px; border-radius: 2px; line-height: 1; background: var(--oferta-bg); color: var(--oferta); border: 1px solid var(--oferta); }
  .card-body { padding: 10px; flex: 1; display: flex; flex-direction: column; gap: 4px; background: #f0ece6; }
  .card-brand { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--mid); text-transform: uppercase; letter-spacing: .05em; }
  .card-name { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 600; line-height: 1.15; }
  .card-pres { font-size: 11px; color: var(--mid); margin-top: 2px; }
  .card-foot { background: #0F3F9E; padding: 8px 10px; display: flex; align-items: flex-start; justify-content: space-between; }
  .prices { display: flex; flex-direction: column; gap: 2px; }
  .price-main { font-family: 'Barlow Condensed', sans-serif; font-size: 27px; font-weight: 800; color: #F5F2EE; line-height: 1; }
  .price-main-label { font-family: 'DM Mono', monospace; font-size: 9px; color: #88aadd; }
  .price-secondary { font-family: 'DM Mono', monospace; font-size: 13px; color: #aac4ee; margin-top: 3px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #4CAF50; flex-shrink: 0; margin-top: 6px; }
</style>
</head>

function fmt(n) { return '$' + n.toLocaleString('es-AR'); }

function card(p) {
  const fb = p.destacada ? '<div class="featured-bar">★ DESTACADO</div>' : '';
  const pres = `Bulto x ${p.bulto_un} un / Pallet x ${p.pallet_bultos} bultos`;
  const priceHTML = `<div class="prices"><div class="price-main">${fmt(p.precio_pallet)}</div><div class="price-main-label">por pallet</div>${p.precio_bulto ? `<div class="price-secondary">Bulto ${fmt(p.precio_bulto)}</div>` : ''}</div>`;
  return `<div class="card ${p.destacada ? 'featured' : ''}">${fb}<div class="card-img"><img src="${p.img}" alt="${p.nombre}" loading="lazy"><span class="badge">Oferta</span></div><div class="card-body"><div class="card-brand">${p.marca}</div><div class="card-name">${p.nombre}</div><div class="card-pres">${pres}</div></div><div class="card-foot">${priceHTML}<div class="dot"></div></div></div>`;
}

function fill(id, items) { document.getElementById(id).innerHTML = items.map(card).join(''); }

function showTab(id, btn) {
  document.querySelectorAll('.grid-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}
